[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docker-reg-tool"
version = "2.0.0"
description = "A Python CLI tool for managing Docker Registry v2 repositories"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
docker-reg-tool = "docker_reg_tool.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docker_reg_tool"]

[tool.ruff]
target-version = "py39"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
